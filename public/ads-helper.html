<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Adsterra Proxy</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      background: transparent;
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="ad-container" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: flex-end;"></div>

  <script>
    // Parse query parameters
    const params = new URLSearchParams(window.location.search);
    const adKey = params.get('adKey');
    const format = params.get('format');
    const height = parseInt(params.get('height') || '60', 10);
    const width = parseInt(params.get('width') || '468', 10);
    const scriptUrl = params.get('scriptUrl');
    const containerId = params.get('containerId');
    const align = params.get('align') || 'bottom';

    // Set alignment
    const adContainer = document.getElementById('ad-container');
    if (align === 'top') {
      adContainer.style.alignItems = 'flex-start';
    } else {
      adContainer.style.alignItems = 'flex-end';
    }

    if (format === 'iframe' && adKey) {
      window.atOptions = {
        'key' : adKey,
        'format' : 'iframe',
        'height' : height,
        'width' : width,
        'params' : {}
      };
      
      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = `https://sidewalkboiling.com/${adKey}/invoke.js`;
      adContainer.appendChild(script);
    } else if (scriptUrl) {
      if (containerId) {
        const div = document.createElement('div');
        div.id = containerId;
        div.style.width = '100%';
        div.style.height = '100%';
        div.style.display = 'flex';
        div.style.justifyContent = 'center';
        div.style.alignItems = (align === 'top' ? 'flex-start' : 'flex-end');
        adContainer.appendChild(div);
      }
      
      const script = document.createElement('script');
      script.async = true;
      script.setAttribute('data-cfasync', 'false');
      script.src = scriptUrl;
      adContainer.appendChild(script);
    }
  </script>
</body>
</html>
